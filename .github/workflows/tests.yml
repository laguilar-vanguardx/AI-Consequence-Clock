name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate records
        run: node tests/validate-records.js
      - name: Validator mutations
        run: node tests/validate.test.js
      - name: Derived totals
        run: node tests/derive.test.js
      - name: Sensitivity table
        run: node tests/sensitivity.test.js
      - name: Methodology page rendering
        run: node tests/methodology-render.test.js
      - name: Source provenance
        run: node tests/provenance.test.js
      - name: Source graph rendering
        run: node tests/source-graph.test.js
      - name: Reference consumer denies by default
        run: node tests/consumer-policy.test.js
      - name: Provenance revision rule
        run: node tests/provenance-history.test.js
      - name: Quote checker (offline)
        run: node tests/verify-provenance-quotes.test.js
      - name: Code owners cover protected paths
        run: node tests/codeowners.test.js

      # Compared with the pull request's own base commit, so the result does not depend on
      # what merged meanwhile. Only that one commit is fetched.
      - name: Provenance changes carry a revision
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git show "${{ github.event.pull_request.base.sha }}:data/incidents.json" > "$RUNNER_TEMP/base-incidents.json"
          node tests/provenance-history.js "$RUNNER_TEMP/base-incidents.json" data/incidents.json

      # Generated files must match the JSON they come from. update-expected.js
      # stamps today's date into "reviewed", and export-csv.js writes CRLF, so
      # those two differences are ignored; anything else fails the build.
      - name: Generated files are up to date
        run: |
          node tests/export-csv.js
          node tests/update-expected.js
          git diff --exit-code --ignore-cr-at-eol -I '"reviewed":'
